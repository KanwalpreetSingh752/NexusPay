services:
  postgres:
    image: postgres:15-alpine
    container_name: nexuspay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexuspay
      POSTGRES_USER: nexuspay_admin
      POSTGRES_PASSWORD: nexuspay_secure_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexuspay_admin -d nexuspay"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nexuspay-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
